<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Commissary Inventory System</title>
<style>
:root{
  --bg:#f4f5f7;--card:#ffffff;--ink:#1f2430;--sub:#6b7280;--line:#e5e7eb;
  --brand:#0f766e;--brand-d:#0b5b55;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;
  --lowbg:#fef3c7;--outbg:#fee2e2;--okbg:#dcfce7;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14161a;--card:#1d2026;--ink:#e8e9ec;--sub:#9aa0aa;--line:#30343c;
    --lowbg:#3a3212;--outbg:#3a1616;--okbg:#123822;
  }
}
:root[data-theme="dark"]{
  --bg:#14161a;--card:#1d2026;--ink:#e8e9ec;--sub:#9aa0aa;--line:#30343c;
  --lowbg:#3a3212;--outbg:#3a1616;--okbg:#123822;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
body{padding:14px 14px 60px}
h1{font-size:20px;margin:4px 0 2px}
.sub{color:var(--sub);font-size:13px;margin-bottom:14px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:6px 0;z-index:5}
nav button{background:var(--card);border:1px solid var(--line);color:var(--ink);padding:8px 12px;border-radius:8px;font-size:13px;cursor:pointer}
nav button.active{background:var(--brand);border-color:var(--brand);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:640px){.grid4{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.kpi .n{font-size:22px;font-weight:bold}
.kpi .l{font-size:12px;color:var(--sub)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--sub);font-weight:600;font-size:12px;text-transform:uppercase}
tbody tr:hover{background:rgba(127,127,127,.08)}
.tblwrap{overflow-x:auto}
input,select{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font-size:13px}
label{font-size:12px;color:var(--sub);display:block;margin-bottom:3px}
.field{margin-bottom:10px}
button.btn{background:var(--brand);border:none;color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;cursor:pointer}
button.btn.secondary{background:transparent;color:var(--brand);border:1px solid var(--brand)}
button.btn.danger{background:var(--bad)}
button.btn:hover{background:var(--brand-d)}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:bold}
.pill.OK{background:var(--okbg);color:var(--ok)}
.pill.LOW{background:var(--lowbg);color:var(--warn)}
.pill.OUT{background:var(--outbg);color:var(--bad)}
.rowline{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;align-items:end;margin-bottom:8px}
@media(max-width:640px){.rowline{grid-template-columns:1fr 1fr}}
.tag{font-size:11px;color:var(--sub)}
.search{margin-bottom:10px}
h2{font-size:16px;margin:0 0 12px}
.linetbl td,.linetbl th{padding:5px 6px}
.receipt{max-width:520px;margin:0 auto;font-family:'Courier New',monospace;font-size:13px}
.receipt h3{text-align:center;margin:2px 0}
.receipt .center{text-align:center}
.receipt table{font-size:12px}
.actionbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
@media print{
  nav,.no-print{display:none!important}
  body{background:#fff;color:#000;padding:0}
  .card{border:none;box-shadow:none;padding:0}
}
.empty{color:var(--sub);font-size:13px;padding:10px 0}
</style>
</head>

function loadState(){
  try{
    const s = localStorage.getItem(LS_KEY);
    if(s) return JSON.parse(s);
  }catch(e){}
  return {
    items: RAW_ITEMS.map(r=>({type:r[0],code:r[1],name:r[2],unit:r[3],min:r[4],price:r[5],stock:r[6]})),
    addLog: RAW_ADDLOG.map((r,i)=>({id:i+1,date:r[0],code:r[1],qty:r[2],supplier:r[3],remarks:r[4]})),
    deliveryLog: RAW_DELLOG.map((r,i)=>({id:i+1,date:r[0],receiptNo:r[1],customer:r[2],code:r[3],qty:r[4],unitCost:r[5],remarks:r[6]})),
    priceLog: [],
    receiptCounter: 70,
    nextLogId: RAW_DELLOG.length + RAW_ADDLOG.length + 10
  };
}
let state = loadState();
function genId(){ state.nextLogId = (state.nextLogId||1)+1; return state.nextLogId; }
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){ console.error(e); } }

function fmt(n){ n = Number(n)||0; return n.toLocaleString(undefined,{maximumFractionDigits:2}); }
function money(n){ return '₱' + fmt(n); }
function today(){ return new Date().toISOString().slice(0,10); }
function status(it){
  if(it.stock<=0) return 'OUT';
  if(it.stock<=it.min) return 'LOW';
  return 'OK';
}
function statusLabel(s){ return s==='OUT'?'OUT OF STOCK':s==='LOW'?'LOW STOCK':'OK'; }
function itemByCode(c){ return state.items.find(i=>i.code===c); }

const TABS = ['Dashboard','Inventory','Add Stock','Delivery Out','Price Log'];
let active = 'Dashboard';
let draftDelivery = { receiptNo:'', customer:'', date: today(), lines: [] };

function renderNav(){
  const nav = document.getElementById('tabs');
  nav.innerHTML = TABS.map(t=>`<button class="${t===active?'active':''}" onclick="setTab('${t}')">${t}</button>`).join('');
}
function setTab(t){ active=t; render(); }

function render(){
  renderNav();
  const app = document.getElementById('app');
  if(active==='Dashboard') app.innerHTML = viewDashboard();
  else if(active==='Inventory') app.innerHTML = viewInventory();
  else if(active==='Add Stock') app.innerHTML = viewAddStock();
  else if(active==='Delivery Out') app.innerHTML = viewDelivery();
  else if(active==='Price Log') app.innerHTML = viewPriceLog();
}

// ---------- DASHBOARD ----------
function viewDashboard(){
  const items = state.items;
  const totalItems = items.length;
  const low = items.filter(i=>status(i)==='LOW').length;
  const out = items.filter(i=>status(i)==='OUT').length;
  const value = items.reduce((s,i)=>s+ (i.stock*i.price),0);
  const recentAdds = state.addLog.slice(-5).reverse();
  const recentOuts = state.deliveryLog.slice(-5).reverse();
  return `
  <div class="grid4">
    <div class="kpi"><div class="n">${totalItems}</div><div class="l">Total Items</div></div>
    <div class="kpi"><div class="n" style="color:var(--warn)">${low}</div><div class="l">Low Stock</div></div>
    <div class="kpi"><div class="n" style="color:var(--bad)">${out}</div><div class="l">Out of Stock</div></div>
    <div class="kpi"><div class="n">${money(value)}</div><div class="l">Stock Value</div></div>
  </div>
  <div class="grid2">
    <div class="card"><h2>Recent Stock In</h2>${recentAdds.length? tbl(['Date','Item','Qty','Supplier'], recentAdds.map(r=>[r.date,itemName(r.code),fmt(r.qty),r.supplier||'-'])):'<div class="empty">No entries yet.</div>'}</div>
    <div class="card"><h2>Recent Deliveries</h2>${recentOuts.length? tbl(['Date','Receipt#','Item','Qty'], recentOuts.map(r=>[r.date,r.receiptNo,itemName(r.code),fmt(r.qty)])):'<div class="empty">No entries yet.</div>'}</div>
  </div>
  <div class="card"><h2>Items Needing Attention</h2>${lowOutTable()}</div>
  `;
}
function itemName(code){ const it=itemByCode(code); return it? it.name : code; }
function tbl(headers, rows){
  return `<div class="tblwrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function lowOutTable(){
  const rows = state.items.filter(i=>status(i)!=='OK').sort((a,b)=>status(a)==='OUT'?-1:1);
  if(!rows.length) return '<div class="empty">Everything is stocked fine 🎉</div>';
  return tbl(['Code','Item','Stock','Min','Status'], rows.map(i=>[i.code,i.name,fmt(i.stock)+' '+i.unit,fmt(i.min),`<span class="pill ${status(i)}">${statusLabel(status(i))}</span>`]));
}

// ---------- INVENTORY ----------
function viewInventory(){
  return `
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
      <h2 style="margin:0">Master Inventory (${state.items.length} items)</h2>
      <button class="btn" onclick="openNewItem()">+ New Item</button>
    </div>
    <input class="search" placeholder="Search item name or code..." oninput="filterInv(this.value)">
    <div id="invTableWrap">${invTable(state.items)}</div>
  </div>
  <div id="itemFormCard"></div>
  `;
}
function invTable(items){
  return tbl(['Code','Item','Type','Unit','Stock','Min','Price','Status',''],
    items.map(i=>[i.code,i.name,i.type,i.unit,fmt(i.stock),fmt(i.min),money(i.price),
      `<span class="pill ${status(i)}">${statusLabel(status(i))}</span>`,
      `<button class="btn secondary" onclick="openEditItem('${i.code}')">Edit</button>`]));
}
function filterInv(q){
  q=q.toLowerCase();
  const rows = state.items.filter(i=>i.name.toLowerCase().includes(q)||i.code.toLowerCase().includes(q));
  document.getElementById('invTableWrap').innerHTML = invTable(rows);
}
function openNewItem(){
  document.getElementById('itemFormCard').innerHTML = itemForm(null);
}
function openEditItem(code){
  document.getElementById('itemFormCard').innerHTML = itemForm(itemByCode(code));
}
function itemForm(it){
  return `<div class="card">
    <h2>${it? 'Edit Item: '+it.name : 'New Item'}</h2>
    <div class="grid2">
      <div class="field"><label>Item Code</label><input id="f_code" value="${it?it.code:''}" ${it?'disabled':''}></div>
      <div class="field"><label>Item Name</label><input id="f_name" value="${it?it.name:''}"></div>
      <div class="field"><label>Type</label><input id="f_type" value="${it?it.type:'Market'}"></div>
      <div class="field"><label>Unit</label><input id="f_unit" value="${it?it.unit:'pcs'}"></div>
      <div class="field"><label>Minimum Stock Level</label><input id="f_min" type="number" step="any" value="${it?it.min:0}"></div>
      <div class="field"><label>Selling Price</label><input id="f_price" type="number" step="any" value="${it?it.price:0}"></div>
      ${it?`<div class="field"><label>Current Stock (manual correction)</label><input id="f_stock" type="number" step="any" value="${it.stock}"></div>`:''}
    </div>
    <div class="actionbar">
      <button class="btn" onclick="saveItem(${it?`'${it.code}'`:'null'})">Save</button>
      ${it?`<button class="btn danger" onclick="deleteItem('${it.code}')">Delete</button>`:''}
      <button class="btn secondary" onclick="document.getElementById('itemFormCard').innerHTML=''">Cancel</button>
    </div>
  </div>`;
}
function saveItem(code){
  const name=document.getElementById('f_name').value.trim();
  const type=document.getElementById('f_type').value.trim()||'Market';
  const unit=document.getElementById('f_unit').value.trim()||'pcs';
  const min=parseFloat(document.getElementById('f_min').value)||0;
  const price=parseFloat(document.getElementById('f_price').value)||0;
  if(!name) return alert('Item name is required.');
  if(code){
    const it=itemByCode(code);
    it.name=name; it.type=type; it.unit=unit; it.min=min;
    if(price!==it.price){ state.priceLog.push({date:today(),code:it.code,price,notes:'Manual edit'}); it.price=price; }
    const stockField=document.getElementById('f_stock');
    if(stockField) it.stock=parseFloat(stockField.value)||0;
  } else {
    const newCode=document.getElementById('f_code').value.trim().toUpperCase();
    if(!newCode) return alert('Item code is required.');
    if(itemByCode(newCode)) return alert('That item code already exists.');
    state.items.push({code:newCode,name,type,unit,min,price,stock:0});
  }
  save(); document.getElementById('itemFormCard').innerHTML=''; render();
}
function deleteItem(code){
  if(!confirm('Delete this item? This cannot be undone.')) return;
  state.items = state.items.filter(i=>i.code!==code);
  save(); document.getElementById('itemFormCard').innerHTML=''; render();
}

function viewAddStock(){
  const log = state.addLog.slice().reverse();
  return `
  <div class="card">
    <h2>Add Stock (Stock In)</h2>
    <div class="grid2">
      <div class="field"><label>Date</label><input id="as_date" type="date" value="${today()}"></div>
      <div class="field"><label>Supplier</label><input id="as_supplier" placeholder="e.g. COMMISSARY"></div>
      <div class="field"><label>Item</label>${itemSelect('as_item')}</div>
      <div class="field"><label>Quantity</label><input id="as_qty" type="number" step="any" placeholder="0"></div>
      <div class="field"><label>Remarks</label><input id="as_remarks" placeholder="optional"></div>
    </div>
    <button class="btn" onclick="submitAddStock()">Post to Stock</button>
  </div>
  <div class="card"><h2>Stock-In Log</h2>${log.length? tbl(['Date','Item Code','Item','Qty','Supplier','Remarks'], log.map(r=>[r.date,r.code,itemName(r.code),fmt(r.qty),r.supplier||'-',r.remarks||'-'])):'<div class="empty">No stock-in entries yet.</div>'}</div>
  `;
}
function itemSelect(id){
  return `<select id="${id}">${state.items.map(i=>`<option value="${i.code}">${i.code} — ${i.name}</option>`).join('')}</select>`;
}
function submitAddStock(){
  const date=document.getElementById('as_date').value||today();
  const supplier=document.getElementById('as_supplier').value.trim();
  const code=document.getElementById('as_item').value;
  const qty=parseFloat(document.getElementById('as_qty').value);
  const remarks=document.getElementById('as_remarks').value.trim();
  if(!qty||qty<=0) return alert('Enter a valid quantity.');
  const it=itemByCode(code); it.stock+=qty;
  state.addLog.push({date,code,qty,supplier,remarks});
  save(); render();
}

// ---------- DELIVERY OUT ----------
function nextReceiptNo(){
  const yr=new Date().getFullYear();
  const n = String(state.receiptCounter).padStart(4,'0');
  return `COM-${yr}-${n}`;
}
function viewDelivery(){
  if(!draftDelivery.receiptNo) draftDelivery.receiptNo = nextReceiptNo();
  const log = state.deliveryLog.slice().reverse();
  const receiptNos = [...new Set(state.deliveryLog.map(r=>r.receiptNo))].reverse();
  return `
  <div class="card">
    <h2>New Delivery / Order (Stock Out)</h2>
    <div class="grid2">
      <div class="field"><label>Delivery Receipt No.</label><input id="dv_receipt" value="${draftDelivery.receiptNo}" oninput="draftDelivery.receiptNo=this.value"></div>
      <div class="field"><label>Date</label><input id="dv_date" type="date" value="${draftDelivery.date}" oninput="draftDelivery.date=this.value"></div>
      <div class="field"><label>Customer / Department</label><input id="dv_customer" value="${draftDelivery.customer}" oninput="draftDelivery.customer=this.value"></div>
    </div>
    <h2 style="font-size:14px">Add Line Item</h2>
    <div class="rowline">
      <div><label>Item</label>${itemSelect('dv_item')}</div>
      <div><label>Qty</label><input id="dv_qty" type="number" step="any" placeholder="0"></div>
      <div><label>Remarks</label><input id="dv_lremarks" placeholder="optional"></div>
      <div><button class="btn secondary" onclick="addDeliveryLine()">+ Add Line</button></div>
    </div>
    ${draftDelivery.lines.length? `<div class="tblwrap"><table class="linetbl"><thead><tr><th>Item</th><th>Qty</th><th>Unit Cost</th><th>Total</th><th></th></tr></thead><tbody>
      ${draftDelivery.lines.map((l,idx)=>`<tr><td>${itemName(l.code)}</td><td>${fmt(l.qty)}</td><td>${money(l.unitCost)}</td><td>${money(l.qty*l.unitCost)}</td><td><button class="btn danger" onclick="removeLine(${idx})">✕</button></td></tr>`).join('')}
    </tbody></table></div>` : '<div class="empty">No line items added yet.</div>'}
    <div class="actionbar">
      <button class="btn" onclick="postDelivery()" ${draftDelivery.lines.length?'':'disabled'}>Post Delivery &amp; Print Receipt</button>
      <button class="btn secondary" onclick="draftDelivery={receiptNo:nextReceiptNo(),customer:'',date:today(),lines:[]};render()">Clear</button>
    </div>
  </div>
  <div class="card"><h2>Reprint or Delete a Receipt</h2>
    <select id="reprintSel">${receiptNos.map(r=>`<option value="${r}">${r}</option>`).join('')}</select>
    <div class="actionbar">
      <button class="btn secondary" onclick="printReceipt(document.getElementById('reprintSel').value)">Print</button>
      <button class="btn danger" onclick="deleteDeliveryReceipt(document.getElementById('reprintSel').value)">Delete Entire Receipt</button>
    </div>
  </div>
  <div class="card"><h2>Delivery Log</h2>${log.length? tbl(['Date','Receipt#','Customer','Item','Qty','Unit Cost','Total',''], log.map(r=>[r.date,r.receiptNo,r.customer||'-',itemName(r.code),fmt(r.qty),money(r.unitCost),money(r.qty*r.unitCost),`<button class="btn danger" onclick="deleteDeliveryEntry(${r.id})">Delete</button>`])):'<div class="empty">No deliveries yet.</div>'}</div>
  `;
}
function addDeliveryLine(){
  const code=document.getElementById('dv_item').value;
  const qty=parseFloat(document.getElementById('dv_qty').value);
  const remarks=document.getElementById('dv_lremarks').value.trim();
  if(!qty||qty<=0) return alert('Enter a valid quantity.');
  const it=itemByCode(code);
  draftDelivery.lines.push({code,qty,unitCost:it.price,remarks});
  render();
}
function removeLine(idx){ draftDelivery.lines.splice(idx,1); render(); }
function postDelivery(){
  const {receiptNo,date,customer,lines}=draftDelivery;
  lines.forEach(l=>{
    const it=itemByCode(l.code); it.stock-=l.qty;
    state.deliveryLog.push({id:genId(),date,receiptNo,customer,code:l.code,qty:l.qty,unitCost:l.unitCost,remarks:l.remarks});
  });
  state.receiptCounter++;
  save();
  const finishedReceipt = receiptNo;
  draftDelivery = {receiptNo:nextReceiptNo(),customer:'',date:today(),lines:[]};
  render();
  printReceipt(finishedReceipt);
}
function deleteDeliveryEntry(id){
  const entry = state.deliveryLog.find(r=>r.id===id);
  if(!entry) return;
  if(!confirm(`Delete this line — ${itemName(entry.code)} (${fmt(entry.qty)}) from ${entry.receiptNo}?\n\nThe quantity will be added back to stock.`)) return;
  const it = itemByCode(entry.code);
  if(it) it.stock += entry.qty;
  state.deliveryLog = state.deliveryLog.filter(r=>r.id!==id);
  save(); render();
}
function deleteDeliveryReceipt(receiptNo){
  if(!receiptNo) return;
  const entries = state.deliveryLog.filter(r=>r.receiptNo===receiptNo);
  if(!entries.length) return alert('No records for that receipt number.');
  if(!confirm(`Delete the ENTIRE receipt ${receiptNo}? (${entries.length} line item(s))\n\nAll quantities will be added back to stock.`)) return;
  entries.forEach(entry=>{ const it=itemByCode(entry.code); if(it) it.stock += entry.qty; });
  state.deliveryLog = state.deliveryLog.filter(r=>r.receiptNo!==receiptNo);
  save(); render();
}
function printReceipt(receiptNo){
  const lines = state.deliveryLog.filter(r=>r.receiptNo===receiptNo);
  if(!lines.length) return alert('No records for that receipt number.');
  const {date,customer}=lines[0];
  const total = lines.reduce((s,l)=>s+l.qty*l.unitCost,0);
  const copyHtml = (label)=>`
    <div class="copy">
      <div class="label">${label}</div>
      <h2>COMMISSARY</h2><p>ORDER / DELIVERY RECEIPT</p>
      <p>Receipt No: ${receiptNo}</p><p>Date: ${date}</p><p>Customer: ${customer||'-'}</p>
      <table><thead><tr><th>Item</th><th class="r">Qty</th><th class="r">Cost</th><th class="r">Total</th></tr></thead><tbody>
      ${lines.map(l=>`<tr><td>${itemName(l.code)}</td><td class="r">${fmt(l.qty)}</td><td class="r">${money(l.unitCost)}</td><td class="r">${money(l.qty*l.unitCost)}</td></tr>`).join('')}
      </tbody></table>
      <p style="text-align:right;font-weight:bold">TOTAL: ${money(total)}</p>
      <p>&nbsp;</p><p>_____________________</p><p>Received By</p>
    </div>`;
  const win = window.open('', '_blank');
  win.document.write(`<html><head><title>${receiptNo}</title><style>
    @page{ size: A4 landscape; margin: 10mm; }
    *{box-sizing:border-box}
    body{font-family:'Courier New',monospace;font-size:12px;margin:0;padding:0}
    .sheet{display:flex;width:100%;height:100%}
    .copy{flex:1;padding:0 14px;border-right:1px dashed #999}
    .copy:last-child{border-right:none}
    .label{text-align:center;font-size:10px;letter-spacing:1px;color:#666;margin-bottom:4px}
    h2,p{text-align:center;margin:2px 0}
    table{width:100%;border-collapse:collapse;margin-top:8px}
    th,td{border-bottom:1px dashed #999;padding:3px;text-align:left;font-size:11px}
    .r{text-align:right}
  </style></head><body>
  <div class="sheet">${copyHtml('CUSTOMER COPY')}${copyHtml('OFFICE COPY')}</div>
  </body></html>`);
  win.document.close();
  win.focus();
  win.print();
}

// ---------- PRICE LOG ----------
function viewPriceLog(){
  const log = state.priceLog.slice().reverse();
  return `
  <div class="card">
    <h2>Update Price</h2>
    <div class="grid2">
      <div class="field"><label>Effective Date</label><input id="pu_date" type="date" value="${today()}"></div>
      <div class="field"><label>Item</label>${itemSelect('pu_item')}</div>
      <div class="field"><label>New Selling Price</label><input id="pu_price" type="number" step="any"></div>
      <div class="field"><label>Notes</label><input id="pu_notes" placeholder="optional"></div>
    </div>
    <button class="btn" onclick="submitPriceUpdate()">Update Price</button>
    <p class="tag">Updates the item's selling price immediately. Master Inventory reflects the latest price automatically — old prices stay in this log.</p>
  </div>
  <div class="card"><h2>Price Change History</h2>${log.length? tbl(['Date','Item Code','Item','New Price','Notes'], log.map(r=>[r.date,r.code,itemName(r.code),money(r.price),r.notes||'-'])):'<div class="empty">No price changes logged yet.</div>'}</div>
  `;
}
function submitPriceUpdate(){
  const date=document.getElementById('pu_date').value||today();
  const code=document.getElementById('pu_item').value;
  const price=parseFloat(document.getElementById('pu_price').value);
  const notes=document.getElementById('pu_notes').value.trim();
  if(isNaN(price)||price<0) return alert('Enter a valid price.');
  itemByCode(code).price=price;
  state.priceLog.push({date,code,price,notes});
  save(); render();
}

render();
</script>
</body>
</html>
